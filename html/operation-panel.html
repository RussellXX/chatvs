<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">
    <title>操作面板</title>
</head>

<body>
    <div class="scroll-area">
        <div class="section-title sub-title">叶子拓扑顺序</div>
        <div id="leaf-order-root" class="leaf-order-root"></div>

        <div class="section-title sub-title">精化历史</div>
        <div id="refinement-history-root" class="refinement-history-root">
            <span class="hint-text">请先选中一个叶子模块</span>
        </div>

        <div class="btn-bar">
            <div class="refine-controls">
                <button type="button" id="refine-main-btn" class="action-btn refine-btn">精化</button>
                <button type="button" id="refine-dropdown-btn" class="refine-select-btn"
                        aria-label="精化选项" aria-haspopup="listbox" aria-expanded="false">
                    <span id="refine-selected-label" class="refine-select-label">全局精化</span>
                    <span class="refine-select-caret" aria-hidden="true">▼</span>
                </button>
                <div id="refine-dropdown" class="dropdown-menu hidden" role="listbox" aria-label="精化方式">
                    <div class="dropdown-item selected" data-action="refine" role="option" aria-selected="true">全局精化</div>
                    <div class="dropdown-item" data-action="localRefine" role="option" aria-selected="false">局部精化</div>
                    <div class="dropdown-item" data-action="generateCode" role="option" aria-selected="false">代码生成</div>
                </div>
            </div>

            <button type="button" id="rollback-btn" class="action-btn rollback-btn">回退粒度</button>
        </div>

        <div class="section-title sub-title">自定义提示词（可选）</div>
        <textarea id="prompt-input" class="prompt-input" rows="2"
                  placeholder="为本次精化 / 代码生成补充提示，留空则使用默认提示词"></textarea>
    </div>

    <script src="{{scriptUri}}"></script>
</body>

</html>

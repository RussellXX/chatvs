<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">
    <title>新增子节点</title>
</head>
<body>
    <h2>新增子节点</h2>
    <p id="parent-hint" class="parent-hint"></p>

    <div class="form-group">
        <label for="name-input">模块名称 <span class="required">*</span></label>
        <input type="text" id="name-input" placeholder="输入模块名称（如 moduleA）" autocomplete="off" spellcheck="false">
        <div id="name-error" class="error-msg">模块名称不能为空。</div>
    </div>

    <div class="form-group">
        <label for="desc-input">模块描述</label>
        <textarea id="desc-input" placeholder="简要描述该模块的功能（可选）"></textarea>
    </div>

    <div class="form-group">
        <label>依赖的其它模块</label>
        <div class="tag-input-wrapper">
            <div id="tag-container" class="tag-input-container">
                <input type="text" id="tag-text-input" class="tag-text-input"
                       placeholder="输入模块名后按 Enter 添加" autocomplete="off" spellcheck="false">
            </div>
            <div id="tag-dropdown" class="tag-dropdown"></div>
        </div>
        <div class="hint">从列表选择或手动输入后按 Enter / 逗号确认</div>
    </div>

    <div class="btn-row">
        <button id="cancel-btn" class="btn btn-secondary">取消</button>
        <button id="ok-btn" class="btn btn-primary">确定</button>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>

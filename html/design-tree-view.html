<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">
    <title>设计树</title>
</head>

<body>
    <div id="tree-root" class="tree-root">
        <!-- Save toolbar (bottom-right) -->
        <div class="save-toolbar-zone" aria-hidden="true"></div>
        <div class="save-toolbar" aria-label="设计树工具">
            <button type="button" id="reset-btn" class="tree-toolbar-btn" title="重置工作区（丢弃全部未保存的划分修改）" aria-label="重置工作区">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2 8a6 6 0 1 1 1.5 4"></path>
                    <polyline points="2,5 2,8 5,8"></polyline>
                </svg>
                <span class="save-btn-label">重置</span>
            </button>
            <button type="button" id="save-btn" class="tree-toolbar-btn save-btn" title="保存设计树" aria-label="保存设计树">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M13.5 1.5H3.5A2 2 0 0 0 1.5 3.5v9A2 2 0 0 0 3.5 14.5h9A2 2 0 0 0 14.5 12.5V2.5L13.5 1.5Z"></path>
                    <path d="M4.5 1.5v4h7v-4"></path>
                    <rect x="5.5" y="8.5" width="5" height="5" rx="0.5"></rect>
                </svg>
                <span class="save-btn-label">保存</span>
            </button>
        </div>

        <!-- ── Add-node dialog overlay ────────────────────────────────── -->
        <div id="add-node-overlay" class="add-node-overlay" hidden>
            <div class="add-node-dialog" role="dialog" aria-modal="true">
                <p class="add-node-title">新增子节点</p>
                <p id="add-node-parent-hint" class="add-node-parent-hint"></p>

                <div class="add-node-field">
                    <label class="add-node-label" for="add-node-name">模块名称 <span class="add-node-req">*</span></label>
                    <input type="text" id="add-node-name" class="add-node-input"
                           placeholder="输入模块名称（如 moduleA）" autocomplete="off" spellcheck="false">
                    <span id="add-node-name-err" class="add-node-err" hidden>名称不能为空。</span>
                </div>

                <div class="add-node-field">
                    <label class="add-node-label" for="add-node-desc">模块描述</label>
                    <textarea id="add-node-desc" class="add-node-textarea"
                              placeholder="简要描述该模块的功能（可选）"></textarea>
                </div>

                <div class="add-node-field">
                    <label class="add-node-label">依赖的其它模块</label>
                    <div class="add-node-tag-wrap">
                        <div id="add-node-tag-box" class="add-node-tag-box">
                            <input type="text" id="add-node-tag-input" class="add-node-tag-text"
                                   placeholder="输入后按 Enter 或逗号添加" autocomplete="off" spellcheck="false">
                        </div>
                        <div id="add-node-dropdown" class="add-node-dropdown"></div>
                    </div>
                    <span class="add-node-hint-sm">从列表选择或手动输入后按 Enter / 逗号确认</span>
                </div>

                <div class="add-node-btns">
                    <button id="add-node-cancel" class="add-node-btn add-node-btn-sec">取消</button>
                    <button id="add-node-ok"     class="add-node-btn add-node-btn-pri">确定</button>
                </div>
            </div>
        </div>

        <div id="tree-scroll" class="tree-scroll">
            <div id="tree-stage" class="tree-stage">
                <div id="tree-canvas" class="tree-canvas"></div>
            </div>
        </div>
    </div>

    <script src="{{d3Uri}}"></script>
    <script src="{{scriptUri}}"></script>
</body>

</html>
